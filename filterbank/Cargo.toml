[workspace]
resolver = "2"
members = ["crates/fb-defs", "crates/fb-io", "crates/fb-formats"]
default-members = ["crates/fb-defs", "crates/fb-io", "crates/fb-formats"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
fb-defs = { path = "crates/fb-defs" }
fb-io = { path = "crates/fb-io" }
fb-formats = { path = "crates/fb-formats" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
